<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>contact me</title>
  </head>
  <body>
    <header>
      <nav>
        <div>
          <ul>
            <li><a href="contact.html">contact us</a></li>
            <li><a href="about.html">about</a></li>
            <li><a href="#footer">footer</a></li>
            <li><a href="project.html">project</a></li>
          </ul>
        </div>
      </nav>
    </header>
    <main>
      <h2>
        <form action="">
          <h1>Welcome to contact form</h1>
          <p>
            feel free to contact us and share your ideas about to througth this
            form!!
          </p>
          <label for="fname">Enter your fname</label><br />
          <input type="text" id="fname" placeholder="enter fname" /><br />
          <label for="fname">Enter your lname</label><br />

          <input
            type="text"
            id="lname"
            placeholder="enter the lastname"
          /><br />
          <label for="email">Enter your email</label><br />

          <input type="text" id="email" placeholder="enter the email" /><br />
          <label for="message" id="message">Enter your message</label><br />

          <textarea id="message" placeholder="enter the message here"></textarea
          ><br />
          <label for="gender">Select your gender:</label><br />
          <input type="radio" id="male" name="gender" value="male" />
            <label for="male">Male</label><br />
          <input type="radio" id="female" name="gender" value="female" />
          <label for="female">Female</label><br />

          <label for="country">Select your country:</label><br />
          <select id="country">
            <option value="australia">Australia</option>
            <option value="canada">Canada</option>
            <option value="usa">USA</option>
          </select><br />

          <label for="checkbox">Select your faforite Lessons</label>
          <input type="checkbox" id="math" name="lessons" value="math" />
          <label for="math">Math</label><br />
          <input type="checkbox" id="english" name="lessons" value="english" />
          <label for="english">English</label><br />
          <input type="checkbox" id="science" name="lessons" value="science" />
          <label for="science">Science</label><br />
        <label for="dates">Enter dates</label>
        <input type="date" id="dates" name="dates" />
        <br />
        <label for="file">Select a file:</label>
        <input type="file" id="file" name="file" accept=".pdf,.docx,.jpg,.jpeg,.png" />
        <br />
        <label for="captcha">Enter the captcha:</label>
        <input type="text" id="captcha" name="captcha" />
        <br />
        <label for="terms">I agree to the terms and conditions:</label>
        <input type="checkbox" id="terms" name="terms" />
        <label for="terms">I agree</label>
     <label for="color">Choose colors</label>

      <input type="color" id="color" name="color" />

          <input type="submit" /> <br />
        </form>
      </h2>
    </main>
    <footer>

    </footer>
  </body>
